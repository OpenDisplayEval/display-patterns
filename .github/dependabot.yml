# Dependabot version-update PRs. Complements (does not replace) Dependabot
# security updates, which open PRs for vulnerability alerts independently.
#
# `chore(deps):` is one of flywheel's auto_merge types (.flywheel.yml), so
# each PR lands once the required checks pass: quality / correctness is the
# gate. A release has a week to draw a follow-up fix before it is proposed,
# which is the soak.
version: 2
updates:
  # Actions are SHA-pinned with a trailing version comment; Dependabot bumps
  # the SHA and rewrites the comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # PyPI packages in pyproject.toml, applied to uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # ruff and pyright bring new findings that need code edits, so they do
    # not hold up the library bumps.
    groups:
      python-lint:
        patterns: ["ruff", "pyright"]
      python-packages:
        patterns: ["*"]
        exclude-patterns: ["ruff", "pyright"]
    commit-message:
      prefix: "chore"
      include: "scope"
