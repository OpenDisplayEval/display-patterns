name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ruff and pyright are pinned to py312 in pyproject.toml, so one leg
  # carries the full lint signal; only pytest is version-sensitive.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          prune-cache: true
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          prune-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras
      - run: uv run pytest

  # Prove the numpy-only core: install the built wheel without extras into a
  # clean environment and run the core probe (§spec:package-shape).
  core-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs derives the version from tag history
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          prune-cache: true
          python-version: "3.12"
      - run: uv build
      - run: uv run --isolated --no-project --with dist/*.whl python tools/check_core_install.py
